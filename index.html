<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataview to Datacore Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Dataview to Datacore Converter</h1>
        <div class="converter">
            <div class="input-section">
                <h2>Dataview Query</h2>
                <textarea id="dataview-input" placeholder="Enter your Dataview query here...">
```dataview
LIST
FROM #writing/published
```
                </textarea>
            </div>
            <div class="output-section">
                <h2>Datacore Query</h2>
                <textarea id="datacore-output" readonly></textarea>
            </div>
        </div>
        <button id="convert-btn">Convert</button>
    </div>
    <script src="converter.js"></script>
</body>
</html>
