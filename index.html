<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQL to Datacore Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>DQL to Datacore Converter</h1>
        <p>This is a Work in Progress tool! It may work for you, or it may not. Good luck!</p>
        <p>Brought to you by <a href="https://obsidian.rocks">Obsidian.Rocks</a></p>
        <div class="converter">
            <div class="input-section">
                <h2>Dataview Query</h2>
                <textarea id="dataview-input" placeholder="Enter your Dataview query here...">

                </textarea>
            </div>
            <div class="output-section">
                <h2>Datacore Query</h2>
                <textarea id="datacore-output" readonly></textarea>
            </div>
        </div>
        <button id="convert-btn">Convert</button>
    </div>
    <script src="converter.js"></script>
</body>
</html>
